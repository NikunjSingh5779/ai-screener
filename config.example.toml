# Local-first configuration for AI Trader. Copy to config.toml before running.

[capture]
# Restrict to the chart only; values are pixels from the primary monitor origin.
region = { left = 0, top = 0, width = 1280, height = 720 }
monitor = 1
full_screen = false

[polling]
interval_seconds = 15
min_flip_hold_seconds = 60

[providers]
# Strictly local; noop is an offline software-test fallback, never real analysis.
chain = ["ollama", "noop"]
cooldown_seconds = 45

[providers.budget]
calls_per_minute = 4
min_interval_seconds = 15

[providers.models]
openrouter = "google/gemma-4-31b-it:free"
anthropic = "claude-sonnet-5"
ollama = "qwen2.5-vl:7b"
lmstudio = "local-model"

[signal]
market = "NSE"
symbol_hint = ""
high_confidence_threshold = 85

[risk]
account_size = 0.0
risk_per_trade_pct = 0.5

[logging]
hotkey = "f9"
excel_path = "Trade_Log_Tracker.xlsx"
