# Local-first configuration for AI Trader. Copy to config.toml before running.

[capture]
region = { left = 0, top = 0, width = 1280, height = 720 }
monitor = 1
full_screen = false

[polling]
interval_seconds = 60
min_flip_hold_seconds = 300

[providers]
# Strictly local; no mock or cloud fallback is enabled.
# PolyStrata/Strata model server uses localhost:8080/v1 by default.
# Use PolyStrata/Strata's image-enabled model API. No cloud is required.
chain = ["polystrata"]
cooldown_seconds = 45
polystrata_base_url = "http://127.0.0.1:8080/v1"
polystrata_api_key = ""

[providers.budget]
calls_per_minute = 4
min_interval_seconds = 15

[providers.models]
openrouter = "google/gemma-4-31b-it:free"
anthropic = "claude-sonnet-5"
ollama = "qwen2.5-vl:7b"
lmstudio = "local-model"
polystrata = "strata"

[signal]
# AUTO identifies NSE/BSE vs US from the visible TradingView exchange label.
# Use "NSE", "BSE", or "US" to pin analysis to one market.
market = "AUTO"
symbol_hint = ""
high_confidence_threshold = 85

[risk]
# Prefer separate balances so quantity calculations never mix INR and USD.
account_size_inr = 0.0
account_size_usd = 0.0
# Legacy single balance. Used only with the matching account_currency.
account_size = 0.0
account_currency = "USD"
risk_per_trade_pct = 0.5

[logging]
hotkey = "f9"
excel_path = "Trade_Log_Tracker.xlsx"
